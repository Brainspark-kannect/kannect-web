<mat-card appearance="outlined" class="mb-2">
    <mat-card-header>
        <mat-card-title class="d-flex justify-content-between align-items-center">
            {{ cardConfig?.title }}
            <img
                *ngIf="cardConfig?.headerImgSrc"
                src="{{ cardConfig?.headerImgSrc }}"
                class="shine-icon"
            />
        </mat-card-title>
        <mat-card-subtitle>
            {{ message }}
        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <div class="mt-3 mb-1">
            <button mat-flat-button class="rounded-5 d-flex justify-content-start w-100">
                <mat-icon class="add-icon">add</mat-icon>
                {{ cardConfig?.addPostButtonTitle }}
            </button>
        </div>
    </mat-card-content>
</mat-card>
